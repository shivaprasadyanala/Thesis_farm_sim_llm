  # farm-sim server used by agentic_approach_baseline_farm_sim.py. This project
  # runs the sim on 3111 (`PORT=3111 npm start`; a bare `npm start` is 3100).
  # Override per run with --url, or drop this key for the same 3111 default.
  farm_sim_url: http://127.0.0.1:3111
  whisper_url: http://hal9000.skim.th-owl.de:8003/transcribe
  ollama_url: http://hal9000.skim.th-owl.de:11430

# OpenAI-compatible server used by `--vllm` (vLLM behind the DGX proxy). The
# model id is the one the server lists under /v1/models - `--model` still wins,
# and is taken from `model` here when the flag is used without it.
vllm:
  base_url: https://llm-proxy-dgx.skim.th-owl.de
  api_key: sk-QB2QKC9IuaSdqBvPy6dnpg
  model: Qwen/Qwen3.8-27B
  # Qwen3 reasons for a long time before its first tool call unless the template
  # is told not to; false keeps a turn inside --llm-timeout. `null` (or deleting
  # the key) sends no chat_template_kwargs at all - use that for models whose
  # template has no `enable_thinking` switch (gemma, ...).
  enable_thinking: false

nvidia:
  # Hosted NVIDIA NIM (build.nvidia.com). It speaks the same OpenAI-compatible API
  # as the DGX proxy, so `--nvidia` reuses the `--vllm` loop and only these values
  # differ. `GET /v1/models` with this key lists what it may call, and `--model`
  # still wins over `model` here.
  base_url: https://integrate.api.nvidia.com/v1
  api_key: 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
  # Any id that key can call and whose model card lists tool calling. Checked here
  # against /v1/models: `openai/gpt-oss-20b` answers `tool_calls` and accepts the
  # chat_template_kwargs below; `meta/llama-3.3-70b-instruct` style ids are the
  # alternative. NIM serves no Qwen build, which is why this default is gpt-oss.
  model: openai/gpt-oss-20b
  # Same switch as `vllm.enable_thinking` (`false` = ask the template to skip the
  # reasoning trace, `null` = send no chat-template kwargs at all).
  enable_thinking: false

